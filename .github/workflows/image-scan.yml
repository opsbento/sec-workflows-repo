name: Central image scan

on:
  workflow_call:
    inputs:
      image_name:
        description: Docker Hub repository, including namespace
        required: true
        type: string
      minio_endpoint:
        description: Public HTTPS S3 API endpoint for MinIO
        required: true
        type: string
      minio_bucket:
        description: Existing MinIO bucket for SBOM files
        required: true
        type: string
    secrets:
      dockerhub_username:
        required: true
      dockerhub_token:
        required: true
      minio_access_key:
        required: true
      minio_secret_key:
        required: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build final image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: docker build --build-arg "GIT_COMMIT=$GITHUB_SHA" --tag "$IMAGE_NAME:main" --tag "$IMAGE_NAME:sha-$GITHUB_SHA" .

      - name: Generate final image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ inputs.image_name }}:main
          format: cyclonedx-json
          output-file: final-image.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan final image
        id: final_scan
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: final-image.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: table
          config: /dev/null

      - name: Build intermediate stage
        run: docker build --target verified --tag draftroom:verified .

      - name: Generate intermediate-stage SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: draftroom:verified
          format: cyclonedx-json
          output-file: verified-image.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan intermediate stage
        id: verified_scan
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: verified-image.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: table
          config: /dev/null

      - name: Enforce image gate
        if: steps.final_scan.outcome == 'failure' || steps.verified_scan.outcome == 'failure'
        run: exit 1

      - name: Store image SBOMs in MinIO
        if: ${{ !cancelled() && github.event_name == 'push' && (hashFiles('final-image.cdx.json') != '' || hashFiles('verified-image.cdx.json') != '') }}
        env:
          MINIO_ENDPOINT: ${{ inputs.minio_endpoint }}
          MINIO_BUCKET: ${{ inputs.minio_bucket }}
          AWS_ACCESS_KEY_ID: ${{ secrets.minio_access_key }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.minio_secret_key }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          if [[ "$MINIO_ENDPOINT" != https://* || -z "$MINIO_BUCKET" ]]; then
            echo 'Set MINIO_ENDPOINT to a reachable HTTPS URL and MINIO_BUCKET to an existing bucket.'
            exit 1
          fi
          aws configure set default.s3.addressing_style path
          SBOM_DATE="$(TZ=Asia/Jakarta date +%F)"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ -f final-image.cdx.json ]]; then
            aws s3api put-object --endpoint-url "$MINIO_ENDPOINT" --bucket "$MINIO_BUCKET" --key "$SBOM_DATE/$GITHUB_SHA/$REPO_NAME-final-image.cdx.json" --body final-image.cdx.json --content-type application/json
          fi
          if [[ -f verified-image.cdx.json ]]; then
            aws s3api put-object --endpoint-url "$MINIO_ENDPOINT" --bucket "$MINIO_BUCKET" --key "$SBOM_DATE/$GITHUB_SHA/$REPO_NAME-verified-image.cdx.json" --body verified-image.cdx.json --content-type application/json
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Push scanned final image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          docker push "$IMAGE_NAME:sha-$GITHUB_SHA"
          docker push "$IMAGE_NAME:main"
