name: Centralized Service Rollback

on:
  workflow_call:
    inputs:
      IMAGE_REPO:
        description: 'Docker Hub repository name'
        required: true
        type: string
      TARGET_TAG:
        description: 'Specific image tag to rollback to'
        required: true
        type: string
    secrets:
      COMPOSE_FILE_PATH:
        required: true

jobs:
  rollback:
    runs-on: [self-hosted, jagoanhosting-deploy]
    steps:
      - name: Rollback compose tag and restart
        env:
          COMPOSE_FILE: ${{ secrets.COMPOSE_FILE_PATH }}
          IMAGE_REPO: ${{ inputs.IMAGE_REPO }}
          TARGET_TAG: ${{ inputs.TARGET_TAG }}
        run: |
          OLD_TAG=$(grep "image: ${IMAGE_REPO}:" "$COMPOSE_FILE" | awk -F':' '{print $NF}')
          
          echo "ROLLBACK AUDIT -> Current Tag: ${OLD_TAG} | Reverting To: ${TARGET_TAG}"

          sed -i "s|image: ${IMAGE_REPO}:.*|image: ${IMAGE_REPO}:${TARGET_TAG}|g" "$COMPOSE_FILE"
          
          docker compose --file "$COMPOSE_FILE" up -d app
          
          sleep 10
          echo "Rollback to version ${TARGET_TAG} completed successfully!"
