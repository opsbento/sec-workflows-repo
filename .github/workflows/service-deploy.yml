name: Centralized Service Deployment

on:
  workflow_call:
    inputs:
      IMAGE_REPO:
        description: 'Docker Hub repository name'
        required: true
        type: string
    secrets:
      COMPOSE_FILE_PATH:
        required: true
      COMPOSE_WORKING_DIR:
        required: true

jobs:
  deploy:
    runs-on: [self-hosted, jagoanhosting-deploy]
    steps:
      - name: Update compose tag and restart
        env:
          COMPOSE_FILE: ${{ secrets.COMPOSE_FILE_PATH }}
          IMAGE_REPO: ${{ inputs.IMAGE_REPO }}
          COMPOSE_DIR: ${{ secrets.COMPOSE_WORKING_DIR }}
        run: |
          set -euo pipefail
          echo "Deploy runner host: $(hostname)"
          if [[ -z "$COMPOSE_DIR" || -z "$COMPOSE_FILE" ]]; then
            echo 'Compose path secrets are missing.'
            exit 1
          fi
          if [[ ! -d "$COMPOSE_DIR" || ! -f "$COMPOSE_FILE" ]]; then
            echo 'Compose directory or file does not exist on this runner host.'
            exit 1
          fi
          if ! grep -Fq "image: ${IMAGE_REPO}:" "$COMPOSE_FILE"; then
            echo 'The Compose file does not contain the IMAGE_REPO configured in repository variables.'
            exit 1
          fi

          OLD_TAG=$(grep "image: ${IMAGE_REPO}:" "$COMPOSE_FILE" | awk -F':' '{print $NF}')
          NEW_TAG="${GITHUB_SHA::8}"
          
          echo "Audit History -> Previous Tag: ${OLD_TAG} | New Tag: ${NEW_TAG}"

          docker pull "${IMAGE_REPO}:${NEW_TAG}"
          sed -i "s|image: ${IMAGE_REPO}:.*|image: ${IMAGE_REPO}:${NEW_TAG}|g" "$COMPOSE_FILE"
          
          cd "$COMPOSE_DIR" && docker compose --file "$COMPOSE_FILE" up -d app
          
          sleep 10
          echo "Deployment successfully"
