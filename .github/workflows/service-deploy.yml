name: Centralized Service Deployment

on:
  workflow_call:
    inputs:
      IMAGE_REPO:
        description: 'Docker Hub repository name'
        required: true
        type: string
      IMAGE_TAG:
        description: Existing scanned image tag; empty uses the caller commit
        required: false
        type: string
        default: ''
    secrets:
      COMPOSE_FILE_PATH:
        required: true

jobs:
  deploy:
    runs-on: [self-hosted, jagoanhosting-deploy]
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Deploy scanned image
        env:
          COMPOSE_FILE: ${{ secrets.COMPOSE_FILE_PATH }}
          IMAGE_REPO: ${{ inputs.IMAGE_REPO }}
          IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
        run: |
          set -euo pipefail

          [[ -f "$COMPOSE_FILE" && "$IMAGE_REPO" =~ ^[a-z0-9][a-z0-9._/-]*$ ]] || exit 1

          NEW_TAG="${IMAGE_TAG:-${GITHUB_SHA::8}}"
          [[ "$NEW_TAG" =~ ^[0-9a-f]{8}$ ]] || exit 1

          OLD_TAG=$(grep -F -m1 "image: ${IMAGE_REPO}:" "$COMPOSE_FILE" | cut -d: -f3)
          [[ -n "$OLD_TAG" ]] || exit 1

          echo "Deploy: ${OLD_TAG} -> ${NEW_TAG}"

          docker pull "${IMAGE_REPO}:${NEW_TAG}"
          sed -i "s|image: ${IMAGE_REPO}:.*|image: ${IMAGE_REPO}:${NEW_TAG}|" "$COMPOSE_FILE"
          docker compose --file "$COMPOSE_FILE" up -d app
